<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% set path = request.url.path %}
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>mihomo<span class="thin">hub</span></div>
    <nav>
      <a href="/" class="{{ 'active' if path == '/' }}">概览</a>
      <a href="/sources" class="{{ 'active' if path.startswith('/sources') }}">订阅源</a>
      <a href="/rulesets" class="{{ 'active' if path.startswith('/rulesets') }}">规则集</a>
      <a href="/profile" class="{{ 'active' if path.startswith('/profile') }}">配置骨架</a>
      <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">设置</a>
    </nav>
    <div class="sidebar-foot">
      <div class="ver">v{{ version }}</div>
      <a href="/profile.yaml" target="_blank" class="mini">查看 /profile.yaml ↗</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      <div class="topbar-actions">{% block actions %}{% endblock %}</div>
    </div>

    {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash err">{{ err }}</div>{% endif %}

    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
